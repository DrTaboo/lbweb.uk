{{ define "main" }}
  <h1 class="mb-3 text-4xl font-extrabold" style="text-align: center">Error 404</h1>
  <p  style="text-align: center">
    Server could not find the requested webpage or file
  </p>
  <div style="font-size: 1rem; font-weight: bold; margin-bottom: 2.5rem; text-align: center; border: none; padding: 0;">
    
  </div>
  <img src="/404.png" class="mx-auto block">
  <div style="font-size: 1rem; font-weight: bold; margin-bottom: 2.5rem; text-align: center; border: none; padding: 0;">
    
  </div>
  <div>
    <hr style="border:none;border-top:0.5px solid rgba(255,255,255,0.1);margin-bottom:40px;"> <!-- DIVIDER -->
  </div>
<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
    <p class="mt-8 mb-12 text-neutral-400 dark:text-neutral-500" style="margin:0;">Whatever you were looking for isn't here.<br>Maybe it moved, or maybe it never existed...</p>
    <a href="/" aria-label="aa"
      style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;border:0.5px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.75);text-decoration:none;font-size:14px;transition:background 0.15s,color 0.15s,transform 0.15s;"
      onmouseenter="this.style.background='rgba(255,255,255,0.12)';this.style.color='#fff';this.style.transform='translateY(-2px)'"
      onmouseleave="this.style.background='rgba(255,255,255,0.06)';this.style.color='rgba(255,255,255,0.75)';this.style.transform=''">
        Take me home!
    </a>
</div>
{{ end }}
